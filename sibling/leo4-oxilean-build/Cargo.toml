# Standalone (NOT a member of the main leo4 workspace).

[package]
name        = "leo4-oxilean-build"
version     = "0.0.0"
edition     = "2024"
rust-version = "1.95"
license     = "MIT OR Apache-2.0"
authors     = ["윤병익 <yeun0908@gmail.com>"]
repository  = "https://github.com/Honey-Be/leo4"
description = "Build-time transpiler from Lean source → native Rust crate, via `oxilean-codegen::rust_target_backend` (consumed from the fork submodule at `sibling/oxilean/`). Sibling adapter to `leo4-oxilean` (runtime-dispatch); this one is the zero-runtime transpile path per `SPEC/rust-native-lean.md` §9. Experimental: primitive arithmetic on sized integers / floats / Char transpiles end-to-end as of OX7 (2026-05-27); see the `--impl rust-transpile` runtime warning for coverage limits."

[features]
# OX6 step 13d (2026-05-24): `leo4-parser` flipped ON by
# default. The oxilean-parse-peg → leo4_translate path is
# now the primary parser for transpile_source*; oxilean-
# parse stays as the fallback. Users wanting the legacy-
# only behaviour can opt out via
# `default-features = false`.
default = ["leo4-parser"]
# Forward leo4-abi's `nightly-floats` feature so the wrapper
# synthesiser can recognise the half-precision / complex
# carrier types (LeanF16, LeanBF16, LeanF128, LeanComplexF16x2,
# LeanComplexBF16x2, LeanComplexF128x2). Requires a nightly
# toolchain — see `crates/leo4-abi/src/floats_nightly.rs`.
nightly-floats = ["leo4-abi/nightly-floats"]
# OX6 step 13c — route the `transpile_source*` entry points
# through `leo4_translate` (`oxilean-parse-peg` → translate →
# oxilean Decl) as the PRIMARY parser path; oxilean-parse
# becomes the fallback when translation fails
# (`TranslateError::Unsupported`). Default OFF in 13c so the
# rollout is opt-in; 13d flips this to ON.
leo4-parser = []

[dependencies]
# leo4 IDL + canonical-ABI + LeanProc/LeanProcInvoker contract.
leo4-abi = { path = "../../crates/leo4-abi" }

# OX6 step 13 — PEG-based Lean 4 parser. Translator lives in
# the `leo4_translate` module; production wiring lands across
# 13a (foundation) → 13b–13c (translator coverage + wiring) →
# 13d (default switchover). oxilean-parse stays as the
# fallback parser path until 13d.
#
# OX7 (2026-05-26): donated upstream to cool-japan/oxilean
# and now consumed from the fork submodule at
# `sibling/oxilean/oxilean-parse-peg/` (branch
# `0.1.3-leo4-ox7`). The crate is leo4-independent; its
# parse errors come back as `oxilean_parse_peg::ParseError`
# and we wrap into `LeanError(DECODE_ERROR)` at the
# boundary inside `transpile_source*`.
oxilean-parse-peg = { path = "../oxilean/oxilean-parse-peg" }

# OxiLean toolchain layered up to codegen. The transpile
# pipeline:
#   oxilean-parse  → parse Lean source
#   oxilean-elab   → elaborate to LCNF (drives Hook 3 — the
#                    attribute / deriving handler registry —
#                    to recognise @[leo4_export]s)
#   oxilean-codegen::rust_target_backend
#                  → LCNF → RustFn AST → Rust source text
#
# OX7 (2026-05-26): consumed from the fork submodule
# (`sibling/oxilean/`, branch `0.1.3-leo4-ox7`) so the
# γ-1' codegen fixes (Const name preservation in (1a),
# return-type inference and UInt mapping coming next)
# light up immediately. Crates.io still ships 0.1.2;
# the fork is unpublished. Bump the submodule SHA when
# pulling new upstream codegen work.
#
# Spec'd against crates.io versions here so cargo
# treats them as registry deps; `[patch.crates-io]`
# below redirects to the fork submodule. This avoids
# the cargo cross-workspace path-dep inheritance bug
# where fork-crate manifests using
# `version.workspace = true` etc. fail to resolve
# inheritance from the invoking workspace.
oxilean-kernel  = "=0.1.2"
oxilean-parse   = "=0.1.2"
oxilean-elab    = "=0.1.2"
oxilean-codegen = "=0.1.2"

[patch.crates-io]
oxilean-kernel  = { path = "../oxilean/crates/oxilean-kernel" }
oxilean-parse   = { path = "../oxilean/crates/oxilean-parse" }
oxilean-elab    = { path = "../oxilean/crates/oxilean-elab" }
oxilean-codegen = { path = "../oxilean/crates/oxilean-codegen" }
# `oxilean-runtime` deliberately omitted — the transpile path
# bypasses OxiLean's evaluator entirely. The generated crate
# has zero OxiLean runtime dep at consumer build time.

# CLI binary (`leo4-oxilean-build`) — OX1 auto-invocation
# surface. lake plugin / leo4-rust-emit / user's build.rs can
# invoke it as a subprocess; it reads a JSON manifest from
# stdin or `--manifest <path>`, runs the transpile pipeline
# over every source listed, and writes the emitted crate to
# `--out-dir`.
[[bin]]
name = "leo4-oxilean-build"
path = "src/bin/leo4-oxilean-build.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
# Product name `OxiLean` appears in docs unbracketed. Don't
# force backticks around it — it's a brand, not a code symbol.
doc_markdown = "allow"
# `HashSet<String>` user-type set is always built with the
# default hasher in this crate. Generalising over `BuildHasher`
# would force every caller to pick one for zero benefit.
implicit_hasher = "allow"
