# Standalone leaf crate (NOT a member of any sibling/*
# workspace, NOT a member of the main leo4 workspace). The
# empty `[workspace]` table tells Cargo to stop walking up.
[workspace]

[package]
name        = "leo4-oxilean-translate"
version     = "0.0.0"
edition     = "2024"
rust-version = "1.95"
license     = "MIT OR Apache-2.0"
authors     = ["윤병익 <yeun0908@gmail.com>"]
repository  = "https://github.com/Honey-Be/leo4"
description = "OX6 step 13 translator from `oxilean-parse-peg`'s Decl/Expr AST into `oxilean-parse`'s Decl/SurfaceExpr AST — extracted as a leaf crate so leo4-oxilean-build (the CLI binary) and leo4-oxilean-runner (the scaffold-facing helper) share one source of truth instead of vendoring the same ~1730-line file twice (task #78 follow-up, 2026-05-28)."

# Library-only — no [[bin]], no CLI, no `[patch.crates-io]`
# block. Same rationale as `leo4-oxilean-bootstrap` (commit
# `41542da`): consumers path-dep into this crate from their
# own workspaces, so the patch block at *this* crate's root
# wouldn't apply to them; we take direct `path =` deps on
# the fork submodule instead.

[dependencies]
# OX6 PEG-based Lean 4 parser — the input side of the
# translator. Direct `path =` to the fork submodule for the
# same reason as oxilean-kernel below.
oxilean-parse-peg = { path = "../oxilean/oxilean-parse-peg" }

# Legacy oxilean-parse Decl / SurfaceExpr AST — the output
# side. Both consumers' downstream elab + codegen still
# consume the legacy AST, so the translator preserves that
# shape unchanged.
oxilean-parse = { path = "../oxilean/crates/oxilean-parse" }

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
