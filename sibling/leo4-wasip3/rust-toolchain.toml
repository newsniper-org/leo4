# sibling/leo4-wasip3 — toolchain (verified 2026-05-21: stable works).
#
# The `wasip3` crate (v0.6, rust-version 1.82) compiles on stable
# Rust against the `wasm32-wasip2` target — the wasip3 crate
# provides WASIp3 API bindings as compat shims on top of wasip2's
# Component Model. We don't need a nightly toolchain or the
# experimental `wasm32-wasip3` target (still tier 3) for this
# sibling.
#
# This is a substantial simplification over the earlier nightly
# plan: the sibling could move back into the main workspace
# once the wire-up stabilises (the only reason it was siblinged
# was the nightly requirement — that's gone). Kept under
# `sibling/` for now because Cargo lockfile separation still
# helps insulate the main workspace from wasip3 dep churn.

[toolchain]
channel    = "stable"
components = ["rustfmt", "clippy"]
profile    = "default"
targets    = ["wasm32-wasip2"]
