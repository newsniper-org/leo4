# Standalone (NOT a member of the main leo4 workspace). The
# empty `[workspace]` table tells Cargo to stop walking up the
# directory tree looking for a workspace root.
[workspace]

[package]
name        = "leo4-oxilean"
version     = "0.0.0"
edition     = "2024"
rust-version = "1.95"
license     = "MIT OR Apache-2.0"
authors     = ["윤병익 <yeun0908@gmail.com>"]
repository  = "https://github.com/Honey-Be/leo4"
description = "leo4 ↔ OxiLean adapter (sibling project, scaffold). Implements `leo4_abi::LeanProc` + `LeanProcInvoker` against OxiLean's Rust-native Lean 4 runtime (`oxilean-runtime` + `oxilean-kernel::ffi`). Currently a SKELETON — see `README.md` §Status before relying on it."

# NOT a member of the main leo4 workspace per
# `SPEC/rust-native-lean.md` §2.2: "the adapter crate lives
# outside the main leo4 workspace; leo4 itself stays runtime-
# agnostic". This sibling pattern matches `sibling/leo4-wasip3/`.

[dependencies]
# leo4 trait surface (LeanProc, LeanProcInvoker, LeanError,
# LeanMarshal). Path-dep into the main leo4 workspace's
# `crates/leo4-abi`; the adapter never depends on
# leo4-mslean4 / leo4-wasm / leo4 façade — only the IDL +
# canonical-ABI primitives shared by every transport.
leo4-abi = { path = "../../crates/leo4-abi" }

# OxiLean v0.1.2 baseline spec'd in the registry-dep form
# below; `[patch.crates-io]` redirects to the fork submodule
# at `sibling/oxilean/` (branch `0.1.3-leo4-ox7`) which
# carries the OX7 codegen + OX8.3a/b extensions needed for
# the callback-dispatch wiring. Mirror of the
# leo4-oxilean-build Cargo.toml pattern (commit `ad26559`).
#
# OX8.3c (2026-05-28): bumped to consume the fork-side
# `CallbackRegistry` (OX8.3a) + `ExternResolver` /
# `dispatch_extern_const` (OX8.3b) so `OxiLeanInvoker::invoke`
# can finally route past the prior `RUST_DLSYM_FAILED` stub.
oxilean-kernel  = "=0.1.2"   # FfiType / FfiValue / ExternRegistry / FfiSignature / CallbackRegistry
oxilean-runtime = "=0.1.2"   # ExternResolver / dispatch_extern_const

[patch.crates-io]
oxilean-kernel  = { path = "../oxilean/crates/oxilean-kernel" }
oxilean-runtime = { path = "../oxilean/crates/oxilean-runtime" }
# Pull in the rest of the fork's crates as transitive
# patches so deeper deps (oxilean-meta etc.) also resolve to
# the fork side. Keeps the dep graph internally consistent.
oxilean-parse   = { path = "../oxilean/crates/oxilean-parse" }
oxilean-elab    = { path = "../oxilean/crates/oxilean-elab" }
oxilean-codegen = { path = "../oxilean/crates/oxilean-codegen" }
oxilean-meta    = { path = "../oxilean/crates/oxilean-meta" }

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"  # rust-native impl details vary per OxiLean version
