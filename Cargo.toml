[workspace]
resolver = "3"
members = [
    "crates/schema-idl",
    "crates/leo4-idl",
    "crates/leo4-abi",
    "crates/leo4-build",
    "crates/leo4-macros",
    "crates/leo4-macros-backend",
    "crates/leo4-mslean4",
    "crates/leo4-wasm",
    "crates/leo4",
    "crates/leo4c",
    "crates/leo4-rust-emit",
    "crates/leo4-rust-worker",
    "crates/leo4-rust-bridge",
    "crates/leo4-cli",
    "examples/01-hello",
    "examples/02-roundtrip",
    "examples/04-mutual-ast",
    "examples/05-rust-export",
]
# OX7 (2026-05-26): exclude sibling projects so cargo
# doesn't fold them into the main leo4 workspace. The
# OxiLean fork submodule at `sibling/oxilean/` carries
# its own `[workspace]` whose crates inherit from a
# `[workspace.package]` table the leo4 root does not
# provide; without this exclude, cargo's path-dep
# inheritance resolver attaches the fork crates to
# leo4's workspace and fails with
# `workspace.package.homepage was not defined`. Each
# sibling already declares its own `[workspace]` block,
# so excluding them here just makes that explicit.
exclude = [
    "sibling/oxilean",
    "sibling/leo4-oxilean-build",
    "sibling/leo4-oxilean",
    "sibling/leo4-wasip3",
    "sibling/mathlib-bridge-test",
]

[workspace.package]
version = "1.0.0-rc.6"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["윤병익 <yeun0908@gmail.com, newsniper@protonmail.com>"]
repository = "https://github.com/Honey-Be/leo4"
readme = "README.md"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Specific allows, set per-crate as needed.

[workspace.dependencies]
# Internal crates
schema-idl            = { path = "crates/schema-idl" }
leo4-idl              = { path = "crates/leo4-idl" }
leo4-abi              = { path = "crates/leo4-abi" }
leo4-build            = { path = "crates/leo4-build" }
leo4-macros           = { path = "crates/leo4-macros" }
leo4-macros-backend   = { path = "crates/leo4-macros-backend" }
leo4-mslean4           = { path = "crates/leo4-mslean4" }
leo4-wasm             = { path = "crates/leo4-wasm" }
leo4                  = { path = "crates/leo4" }
leo4-rust-emit        = { path = "crates/leo4-rust-emit" }
leo4-rust-worker      = { path = "crates/leo4-rust-worker" }
leo4-rust-bridge      = { path = "crates/leo4-rust-bridge" }

# External
thiserror   = "2"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
blake3      = "1"
base32      = "0.5"
libloading  = "0.8"
syn         = { version = "2", features = ["full", "extra-traits"] }
quote       = "1"
proc-macro2 = "1"
clap        = { version = "4", features = ["derive"] }
# Phase 9: reverse-direction (Rust -> Lean). `linkme` provides
# distributed slices for static metadata collection from
# `#[leo4::export]`-tagged functions in user cdylibs.
# Optional via `rust-exports` feature on `leo4-abi`.
linkme      = "0.3"
# Phase 9-4a: build helper for `leo4-rust-bridge`'s C TU.
cc          = "1"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = "limited"
