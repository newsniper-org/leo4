[workspace]
resolver = "3"
members = [
    "crates/schema-idl",
    "crates/leo4-idl",
    "crates/leo4-abi",
    "crates/leo4-build",
    "crates/leo4-macros",
    "crates/leo4-macros-backend",
    "crates/leo4-native",
    "crates/leo4-wasm",
    "crates/leo4",
    "crates/leo4c",
    "crates/leo4-rust-emit",
    "examples/01-hello",
    "examples/02-roundtrip",
    "examples/04-mutual-ast",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["윤병익 <yeun0908@gmail.com, newsniper@protonmail.com>"]
repository = "https://github.com/Honey-Be/leo4"
readme = "README.md"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Specific allows, set per-crate as needed.

[workspace.dependencies]
# Internal crates
schema-idl            = { version = "0.1.0", path = "crates/schema-idl" }
leo4-idl              = { version = "0.1.0", path = "crates/leo4-idl" }
leo4-abi              = { version = "0.1.0", path = "crates/leo4-abi" }
leo4-build            = { version = "0.1.0", path = "crates/leo4-build" }
leo4-macros           = { version = "0.1.0", path = "crates/leo4-macros" }
leo4-macros-backend   = { version = "0.1.0", path = "crates/leo4-macros-backend" }
leo4-native           = { version = "0.1.0", path = "crates/leo4-native" }
leo4-wasm             = { version = "0.1.0", path = "crates/leo4-wasm" }
leo4                  = { version = "0.1.0", path = "crates/leo4" }
leo4-rust-emit        = { version = "0.1.0", path = "crates/leo4-rust-emit" }

# External
thiserror   = "2"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
blake3      = "1"
base32      = "0.5"
libloading  = "0.8"
syn         = { version = "2", features = ["full", "extra-traits"] }
quote       = "1"
proc-macro2 = "1"
clap        = { version = "4", features = ["derive"] }
# Phase 9: reverse-direction (Rust -> Lean). `linkme` provides
# distributed slices for static metadata collection from
# `#[leo4::export]`-tagged functions in user cdylibs.
# Optional via `rust-exports` feature on `leo4-abi`.
linkme      = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = "limited"
