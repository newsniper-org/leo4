[package]
name        = "leo4"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
description = "Top-level façade re-exporting `leo4-mslean4` (loader / dispatch) and `leo4-abi` (canonical-ABI marshalling). Downstream Rust crates depend on this one. See LEO4-DESIGN.md §9."

[features]
# Pass-through to `leo4-abi`'s `nightly-floats` feature. Nightly
# Rust required when enabled (`feature(f16, f128)` at crate roots).
nightly-floats = ["leo4-abi/nightly-floats"]
# Phase 9 reverse-direction (Rust -> Lean). As of RC.2
# (2026-05-31), `__private::EXPORTS` / `__private::USER_TYPES`
# and the `linkme` re-export are *unconditionally* compiled so
# `#[derive(LeanMarshal)]` and `#[leo4::export]` emit their
# distributed-slice entries without surfacing
# `unexpected_cfg(feature = "rust-exports")` lints in every
# downstream user crate. The feature stays as a no-op alias
# for backward compat with user Cargo.toml setups that listed
# it explicitly.
rust-exports = ["leo4-abi/rust-exports"]

[dependencies]
leo4-abi.workspace    = true
leo4-mslean4.workspace = true
leo4-macros.workspace = true
# Re-exported through `leo4::__private::linkme` so user
# cdylibs invoking `#[leo4::export]` / `#[derive(LeanMarshal)]`
# need not depend on `linkme` directly. Unconditional since
# RC.2 (2026-05-31).
linkme.workspace = true

[lints]
workspace = true
