[package]
name        = "leo4-wasm"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
description = "wasm host runtime for leo4. Public API surface mirrors `leo4-native` so cfg-gated user code compiles cleanly on both. Phase 10-C4 + C4.x landed: `Lean` shape + `WasmRuntime` trait + two feature-gated backend stubs (`backend-wasmtime` default, `backend-wasmi` opt-in). The Component Model interface is pinned at `SPEC/wit/leo4-host.wit` (leo4:host@0.1.0). Real wasmtime / wasmi dispatch via `wit-bindgen` lands in C4.x.x."

[features]
# Exactly ONE backend must be active. Default = wasmtime;
# `--no-default-features --features backend-wasmi` swaps. Enabling
# both at once is rejected by a `compile_error!` in `lib.rs`.
default          = ["backend-wasmtime"]
backend-wasmtime = []
backend-wasmi    = []

[dependencies]
leo4-abi   = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
# wasmtime / wasmi / wasm_component_layer deps NOT pulled in
# until C4.x.x — the current backend modules are stubs whose
# real impls require `wit-bindgen` against SPEC/wit/leo4-host.wit.

[lints]
workspace = true
